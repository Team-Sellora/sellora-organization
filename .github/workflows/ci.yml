name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main
      - develop

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.403

      - name: Restore dependencies
        run: dotnet restore Sellora.CoreService.sln

      - name: Build solution
        run: dotnet build Sellora.CoreService.sln --configuration Release --no-restore

      - name: Run tests
        run: |
          dotnet test Sellora.CoreService.sln \
            --configuration Release \
            --no-build \
            --logger "trx;LogFileName=test-results.trx" \
            --results-directory ./TestResults

      - name: Build Docker image
        run: |
          IMAGE_TAG=ghcr.io/${{ github.repository_owner }}/sellora-core-service:${{ github.sha }}
          docker build -t "$IMAGE_TAG" .
          echo "IMAGE_TAG=$IMAGE_TAG" >> $GITHUB_ENV

      - name: Verify Docker image runs
        run: |
          docker run --rm -d -p 8080:8080 --name sellora-core-service-ci "$IMAGE_TAG"
          sleep 10
          curl -fsS http://localhost:8080/health || curl -fsS http://localhost:8080/health
          docker stop sellora-core-service-ci

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: ./TestResults
