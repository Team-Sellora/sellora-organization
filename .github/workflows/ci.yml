name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main
      - dev

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: organization_ci
          POSTGRES_USER: sellora_ci
          POSTGRES_PASSWORD: sellora_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sellora_ci -d organization_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      kafka:
        image: apache/kafka:3.9.2
        ports:
          - 9092:9092
        env:
          KAFKA_NODE_ID: 1
          KAFKA_PROCESS_ROLES: broker,controller
          KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
          KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
          KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
          KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
          KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
          KAFKA_NUM_PARTITIONS: 3
        options: >-
          --health-cmd "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 12
          --health-start-period 15s

    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.403

      - name: Restore dependencies
        run: dotnet restore Sellora.CoreService.sln

      - name: Build solution
        run: dotnet build Sellora.CoreService.sln --configuration Release --no-restore

      - name: Wait for Kafka broker
        run: |
          CONTAINER_ID="${{ job.services.kafka.id }}"
          echo "Kafka container ID: ${CONTAINER_ID}"
          for attempt in $(seq 1 60); do
            if docker exec "${CONTAINER_ID}" \
                /opt/kafka/bin/kafka-broker-api-versions.sh \
                --bootstrap-server localhost:9092 >/dev/null 2>&1; then
              echo "Kafka broker is ready"
              exit 0
            fi
            echo "Waiting for Kafka broker (${attempt}/60)..."
            sleep 2
          done
          echo "Kafka broker did not become ready in time"
          docker logs "${CONTAINER_ID}" || true
          exit 1

      - name: Run tests
        run: |
          dotnet test Sellora.CoreService.sln \
            --configuration Release \
            --no-build \
            --logger "trx;LogFileName=test-results.trx" \
            --results-directory ./TestResults

      - name: Build Docker image
        run: |
          OWNER_LC=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          IMAGE_TAG=ghcr.io/$OWNER_LC/sellora-core-service:${{ github.sha }}
          docker build -t "$IMAGE_TAG" .
          echo "IMAGE_TAG=$IMAGE_TAG" >> $GITHUB_ENV

      - name: Verify Docker image runs
        run: |
          set -euo pipefail
          cleanup() {
            docker logs sellora-core-service-ci 2>&1 || true
            docker rm -f sellora-core-service-ci 2>/dev/null || true
          }
          trap cleanup EXIT

          docker run --rm -d \
            -e ASPNETCORE_URLS=http://+:8080 \
            -e ConnectionStrings__Default="Host=host.docker.internal;Port=5432;Database=organization_ci;Username=sellora_ci;Password=sellora_ci_password" \
            --add-host=host.docker.internal:host-gateway \
            -p 8080:8080 \
            --name sellora-core-service-ci \
            "$IMAGE_TAG"
          curl --fail --silent --show-error \
            --retry 12 \
            --retry-delay 2 \
            --retry-connrefused \
            --retry-all-errors \
            http://127.0.0.1:8080/health

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: ./TestResults
